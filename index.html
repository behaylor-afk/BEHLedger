<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Household Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    /* canvas + surfaces (TaskFlow) */
    --paper:#FAF9F7;--card:#FFFFFF;--sunk:#F5F3F0;--line:#EAE7E1;
    /* ink */
    --ink:#1A1915;--ink2:#2E2C28;--text:#33312C;--muted:#6B6860;
    /* signature accent (amber) */
    --volt:#EF9F27;--volt-deep:#BA7517;
    /* semantics */
    --brass:#EF9F27;--inflow:#1D9E75;--outflow:#D85A30;--warn:#BA7517;--equity:#127881;
    --tint-in:#E1F5EE;--tint-out:#FAECE7;--tint-eq:#E1F1F2;--tint-warn:#FAEEDA;
    --r-card:22px;--r-ctl:12px;
    --shadow:0 1px 2px rgba(26,25,21,.03),0 8px 24px rgba(26,25,21,.06);
    --display:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--text);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh;padding:12px;gap:12px}
  .num{font-variant-numeric:tabular-nums}
  .serif{font-family:var(--display);letter-spacing:-.015em}
  .pos{color:var(--inflow)}.neg{color:var(--outflow)}.eq{color:var(--equity)}

  /* ---- sidebar: floating near-black slab ---- */
  .side{width:230px;flex-shrink:0;background:var(--ink);color:#B6B6AE;display:flex;flex-direction:column;position:sticky;top:12px;height:calc(100vh - 24px);border-radius:26px;overflow:hidden}
  .brand{padding:22px 20px 16px}
  .brand .mark{font-family:var(--display);font-weight:600;font-size:20px;color:#F4F4EF;display:flex;align-items:center;gap:9px;letter-spacing:-.02em}
  .brand .mark::before{content:"";width:10px;height:10px;background:var(--volt);border-radius:50%}
  .brand .sub{font-size:10.5px;color:#6E6E67;margin-top:5px;letter-spacing:.1em;text-transform:uppercase}
  nav{padding:6px 10px;flex:1;overflow-y:auto}
  .navsec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#5A5A54;padding:12px 10px 5px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#A8A8A0;font-family:inherit;font-size:13.5px;padding:9px 12px;border-radius:999px;cursor:pointer;margin:2px 0;transition:background .15s,color .15s}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#EDEDE7}
  .nav-item.active{background:var(--volt);color:#2A1706;font-weight:600}
  .nav-item .badge{margin-left:auto;background:var(--volt);color:#2A1706;font-size:10.5px;font-weight:600;border-radius:999px;padding:1px 7px}
  .nav-item.active .badge{background:#2A1706;color:var(--volt)}
  .side-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6E6E67;line-height:1.5}
  .side-foot b{color:#9C9C93;font-weight:500}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--volt);margin-right:6px;box-shadow:0 0 0 3px rgba(239,159,39,.25)}

  main{flex:1;min-width:0;display:flex;flex-direction:column}
  .demo{background:var(--tint-warn);color:#7A4A12;font-size:12px;text-align:center;padding:6px;border-radius:999px;margin-bottom:8px}
  .demo code{background:#E7DCBE;padding:1px 5px;border-radius:5px}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:12px 8px 16px}
  .topbar .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .topbar h1{font-family:var(--display);font-weight:600;font-size:27px;color:var(--ink);letter-spacing:-.025em}
  .topbar .rule{height:4px;width:28px;background:var(--volt);margin-top:9px;border-radius:999px}
  .monthsel{display:flex;align-items:center;gap:3px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  .monthsel button{background:none;border:0;cursor:pointer;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:16px;display:grid;place-items:center}
  .monthsel button:hover:not(:disabled){background:var(--paper)}
  .monthsel button:disabled{opacity:.25;cursor:default}
  .monthsel .lbl{font-weight:600;font-size:13px;min-width:96px;text-align:center;color:var(--ink)}
  .content{padding:0 8px 44px}

  /* ---- surfaces ---- */
  .card{background:var(--card);border:0;border-radius:var(--r-card);box-shadow:var(--shadow)}
  .panel{padding:18px 20px}
  .panel h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .panel h3 .hint{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--muted)}
  /* signature: paired lower cards carry a drawn "handle" notch */
  .cols .panel{position:relative;padding-top:26px}
  .cols .panel::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:34px;height:4px;border-radius:999px;background:var(--line)}

  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{padding:18px 20px;position:relative;overflow:hidden;border-radius:var(--r-card)}
  .kpi .k-lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .kpi .k-val{font-family:var(--display);font-size:30px;font-weight:600;margin-top:10px;color:var(--ink);line-height:1;letter-spacing:-.03em}
  .kpi .k-sub{font-size:12px;color:var(--muted);margin-top:8px}
  .kpi.hero{background:var(--volt)}
  .kpi.hero .k-lbl{color:#7A4A12}.kpi.hero .k-val{color:#2A1706;font-size:34px}.kpi.hero .k-sub{color:#7A4A12}
  .spark{position:absolute;right:14px;bottom:12px;opacity:.9}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}

  .barwrap{display:flex;align-items:flex-end;gap:24px;height:170px;padding:6px 4px 0}
  .mgroup{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
  .mbars{flex:1;display:flex;align-items:flex-end;gap:6px;width:100%;justify-content:center}
  .mbar{width:24px;border-radius:6px 6px 2px 2px;position:relative;transition:height .6s cubic-bezier(.2,.7,.2,1)}
  .mbar.in{background:var(--inflow)}.mbar.ex{background:var(--outflow)}
  .mbar .cap{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
  .mlabel{font-size:12px;color:var(--muted)}.mlabel .net{display:block;font-weight:600;color:var(--ink);font-size:12px;margin-top:2px}
  .legend{display:flex;gap:16px;margin-top:2px;font-size:12px;color:var(--muted)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

  .catrow{margin-bottom:12px}
  .catrow .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .catrow .top .amt{color:var(--ink);font-weight:500}
  .track{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
  .fillbar{height:100%;background:var(--ink);border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .catrow .pct{color:var(--muted);font-size:11px}

  table{width:100%;border-collapse:collapse}
  th{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{background:var(--card);transition:background .1s}
  tbody tr:nth-child(even){background:var(--sunk)}
  tbody tr:hover{background:var(--tint-warn)}
  .r{text-align:right}.amtcell{font-weight:500;font-family:var(--display)}
  .pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
  .pill.transfer{color:var(--muted);font-style:italic}
  .cat{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--tint-in);color:var(--inflow);font-weight:500;white-space:nowrap}
  .cat.inc{background:var(--tint-eq);color:var(--equity)}.cat.none{background:var(--tint-warn);color:var(--warn)}.cat.cap{background:var(--tint-eq);color:var(--equity)}
  .inst{color:var(--muted);font-size:11.5px}
  .splitline td{padding-top:3px;padding-bottom:3px;font-size:12px;background:var(--sunk)}
  .splitline .lead{color:var(--muted);padding-left:22px}
  .splitbtn{font-size:11px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;cursor:pointer}
  .splitbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .splitbtn.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .splitbtn.on:hover{background:var(--ink2)}
  .haslead{display:inline-block;width:14px;color:var(--muted)}

  .acct-group{margin-bottom:12px}
  .acct-group .gh{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 11px;border-bottom:1px solid var(--line);margin-bottom:5px}
  .acct-group .gh .gt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .acct-group .gh .gs{font-family:var(--display);font-size:16px;color:var(--ink);letter-spacing:-.02em}
  .acct{display:flex;justify-content:space-between;align-items:center;padding:11px 2px}
  .acct .an{font-size:13.5px;color:var(--ink)}.acct .ai{font-size:11.5px;color:var(--muted);margin-top:1px}
  .acct .ab{font-family:var(--display);font-size:14.5px}
  .networth{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;margin-top:8px;background:var(--ink);border-radius:var(--r-card);color:#fff}
  .networth .nl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#9C9A96}
  .networth .nv{font-family:var(--display);font-size:28px;color:var(--volt);letter-spacing:-.03em}

  .filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  select,input[type=text],input[type=number],input[type=date]{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--card);color:var(--text)}
  select:focus,input:focus{outline:2px solid var(--ink);outline-offset:1px}
  .btn{font-family:inherit;font-size:12.5px;font-weight:500;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .btn:hover{background:var(--sunk)}
  .btn.primary{background:var(--ink);color:#F4F4EF;border-color:var(--ink)}.btn.primary:hover{background:var(--ink2)}
  .btn.brass{background:var(--volt);color:#2A1706;border-color:var(--volt);font-weight:600}
  .btn.brass:hover{background:var(--volt-deep)}
  .btn.sm{padding:6px 11px;font-size:11.5px}

  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
  .st.tied{background:var(--tint-in);color:var(--inflow)}.st.off{background:var(--tint-out);color:var(--outflow)}
  .st.man{background:var(--sunk);color:var(--muted)}.st.mkt{background:var(--tint-eq);color:var(--equity)}
  .need{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--tint-warn);color:var(--warn);font-weight:500}
  .tieout{display:flex;align-items:center;gap:10px;border-radius:999px;padding:11px 18px;margin-bottom:14px;font-size:13px;background:var(--tint-in);color:#1E5340}
  .tieout.warn{background:var(--tint-warn);color:#7A4A12}

  .batch{margin-bottom:12px;overflow:hidden}
  .bh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--sunk);flex-wrap:wrap}
  .bh .src{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--ink);font-size:13.5px}
  .bh .chip{width:8px;height:18px;border-radius:999px}.chip.sf{background:var(--inflow)}.chip.csv{background:var(--volt)}.chip.man{background:var(--equity)}
  .bh .meta{font-size:11.5px;color:var(--muted)}

  .asset{padding:18px 20px;margin-bottom:12px}
  .aval{font-family:var(--display);font-size:23px;color:var(--ink);letter-spacing:-.03em}
  .stale{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;margin-top:4px;font-weight:500}
  .stale.ok{background:var(--tint-in);color:var(--inflow)}.stale.old{background:var(--tint-warn);color:var(--warn)}
  .equity{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .equity .e{font-size:12px;color:var(--muted)}.equity .e b{font-family:var(--display);font-size:14px;color:var(--ink);display:block;margin-top:2px}

  .drop{border:1.5px dashed var(--line);border-radius:var(--r-card);padding:24px;text-align:center;color:var(--muted);font-size:13px}
  .fr{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
  .fr .fld{flex:1;min-width:96px}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
  .summ{display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap}.summ .s b{font-family:var(--display);font-size:20px;display:block;letter-spacing:-.02em}.summ .s{font-size:12px;color:var(--muted)}
  tr.dup{background:var(--sunk);color:var(--muted)}.tag{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:500}
  .tag.new{background:var(--tint-in);color:var(--inflow)}.tag.dup{background:var(--sunk);color:var(--muted)}.tag.transfer{background:var(--tint-eq);color:var(--equity)}
  .ck{width:15px;height:15px;accent-color:var(--ink)}

  .overlay{position:fixed;inset:0;background:rgba(19,19,22,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--card);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.28);width:100%;max-width:560px;max-height:88vh;overflow:auto}
  .modal .mh{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{font-family:var(--display);font-size:19px;color:var(--ink);letter-spacing:-.02em}
  .modal .mb{padding:20px 24px}
  .modal .close{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:50%}
  .modal .close:hover{background:var(--sunk);color:var(--ink)}
  .alloc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;margin-top:6px}
  .alloc.ok{color:var(--inflow)}.alloc.bad{color:var(--outflow)}

  .view{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (max-width:820px){
    body{flex-direction:column;padding:8px;gap:8px}
    .side{width:100%;height:auto;position:static;border-radius:20px}
    nav{display:flex;overflow-x:auto;padding:8px}.navsec{display:none}
    .nav-item{white-space:nowrap}
    .side-foot{display:none}
    .grid-kpi{grid-template-columns:repeat(2,1fr)}.topbar{padding:8px}.content{padding:0 2px 30px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* bills */
  .bs{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap;display:inline-block}
  .bs.paid{background:var(--tint-in);color:var(--inflow)}
  .bs.due{background:var(--sunk);color:var(--muted)}
  .bs.missing{background:var(--tint-out);color:var(--outflow)}
  .bs.high{background:var(--tint-warn);color:var(--warn)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-h{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
  .cal-cell{min-height:78px;background:var(--sunk);border-radius:12px;padding:6px}
  .cal-cell.empty{background:transparent}
  .cal-cell.today{outline:2px solid var(--ink);outline-offset:-2px}
  .cal-d{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .cal-bill{font-size:10px;padding:2px 6px;border-radius:6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:default}
  .cal-bill.paid{background:var(--tint-in);color:var(--inflow)}
  .cal-bill.due{background:#fff;color:var(--ink2);border:1px dashed var(--line)}
  .cal-bill.missing{background:var(--tint-out);color:var(--outflow)}
  .cal-bill.high{background:var(--tint-warn);color:var(--warn)}
  @media(max-width:820px){.cal-cell{min-height:56px}.cal-bill{font-size:9px}}

  /* dashboard account cards */
  .acctgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  @media(max-width:900px){.acctgrid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.acctgrid{grid-template-columns:1fr}}
  .acctcard{display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:116px;padding:16px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .acctcard:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(19,19,22,.12)}
  .acctcard .ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .acctcard .ac-logo{height:26px;width:auto;max-width:150px;object-fit:contain;display:block}
  .acctcard .ac-logo.ac-card{height:42px;border-radius:6px;box-shadow:0 1px 3px rgba(19,19,22,.18)}
  .acctcard .ac-kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .acctcard .ac-arrow{color:var(--muted);font-size:15px;flex-shrink:0}
  .acctcard:hover .ac-arrow{color:var(--ink)}
  .acctcard .ac-bal{font-family:var(--display);font-size:24px;letter-spacing:-.025em;line-height:1}
  .acctcard .ac-inst{font-size:11px;color:var(--muted);margin-top:3px}
  .acctcard.missing{cursor:default;opacity:.55}
  .acctcard.missing:hover{transform:none;box-shadow:var(--shadow)}

  /* tags */
  .tagchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.suggested{background:var(--tint-warn)!important;border-color:var(--volt)!important;color:var(--warn)!important;font-style:italic}
  .tagchip{font-size:10px;padding:1px 8px;border-radius:6px;background:var(--tint-warn);color:var(--warn);white-space:nowrap;display:inline-block;vertical-align:middle;position:relative;top:-1px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .tagchip.on{background:var(--tint-eq);color:var(--equity);font-weight:500}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><div class="mark">Ledger</div><div class="sub">Household Finance</div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div><span class="dot"></span><b>SimpleFIN + CSV + Cash</b></div><div style="margin-top:4px" id="footInfo"></div></div>
  </aside>
  <main>
    <div class="demo" id="demoBar"></div>
    <div class="topbar">
      <div><div class="eyebrow" id="crumb"></div><h1 id="title"></h1><div class="rule"></div></div>
      <div class="monthsel" id="monthsel"><button id="prev">‹</button><span class="lbl num" id="mlbl"></span><button id="next">›</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
  <div id="modalHost"></div>

<script>
/* ============================================================ CONFIG */
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbyH0mol87BcdHnxMR9eRvZFzL-h4SSGkSYiCI4n9nUD3CvcOovX7OzDe64kxZMy75vQtw/exec'};

/* ============================================================ DATA MODEL */
let MONTHS=['2026-05','2026-06','2026-07'];
let MONTH_NAMES={'2026-05':'May 2026','2026-06':'June 2026','2026-07':'July 2026'};
let current='2026-07';
let watermark=new Date('2026-07-05T08:12:00');
const NOW=new Date('2026-07-12T14:30:00');
const IMPORT_SEEN='2026-07-12T10:30:00';

const CAPITAL_CATEGORIES=['Mortgage Principal','Loan Principal','Investment Contribution'];
const INCOME=new Set(['Consulting Income','Interest Income']);
let TRANSFER_CATS=new Set();

function categorize(desc){const d=desc.toUpperCase();const sorted=[...RULES].sort((a,b)=>b.pattern.length-a.pattern.length);for(const r of sorted){if(d.includes(r.pattern.toUpperCase()))return r.category;}return '';}
function runRules(){TXNS.forEach(t=>{ if(t.manualCat) {} else t.category=categorize(t.desc); t.transfer=(t.category==='Transfer'); });}
function seedManualCategories(){
  TXNS.filter(t=>t.account_key==='cash-wallet').forEach(t=>{
    if(t.amount>0)t.category='Transfer';
    else if(/untracked/i.test(t.desc))t.category='Cash Spending';
    else if(/farmers|market|coffee|grocer/i.test(t.desc))t.category='Groceries';
    else if(/parking/i.test(t.desc))t.category='Gas & Auto';
    else if(/allowance|kids/i.test(t.desc))t.category='Childcare';
    else t.category='Cash Spending';
    t.manualCat=true;
  });
}
seedManualCategories();
runRules();

function effectiveLines(t){
  if(SPLITS[t.id])return SPLITS[t.id].map(s=>({category:s.category,amount:s.amount,cls:s.cls}));
  const cls=t.transfer?'transfer':CAPITAL_CATEGORIES.includes(t.category)?'capital':t.amount>0?'income':'expense';
  return [{category:t.category,amount:t.amount,cls}];
}
const acctTxnSum=key=>TXNS.filter(t=>t.account_key===key).reduce((s,t)=>s+t.amount,0);
function acctBalance(a){if(a.kind==='invest')return a.feed;return Math.round((a.begin+acctTxnSum(a.key))*100)/100;}
const valAsset=v=>v.history[v.history.length-1][1];
const assetDue=v=>v.history[v.history.length-1][0].slice(0,7)!==new Date().toISOString().slice(0,7);
const valuationsDue=()=>VALUED.filter(assetDue).length;
const isSplit=t=>!!(SPLITS[t.id]&&SPLITS[t.id].length);
const isCategorized=t=>!!(t.transfer||t.category||isSplit(t));
const todayISO=()=>new Date().toISOString().slice(0,10);
const slugKey=n=>(n||'asset').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)+'-'+Math.random().toString(36).slice(2,6);

function monthAgg(m){
  let income=0,expense=0,capital=0;const cats={};
  TXNS.filter(t=>t.date.startsWith(m)).forEach(t=>{
    effectiveLines(t).forEach(l=>{
      if(l.cls==='transfer')return;
      if(l.cls==='income'){income+=l.amount;return;}
      if(l.cls==='capital'){capital+=-l.amount;return;}
      expense+=-l.amount;const c=l.category||'Uncategorized';cats[c]=(cats[c]||0)+(-l.amount);
    });
  });
  return{income,expense,capital,net:income-expense-capital,cats};
}
const AGG=()=>Object.fromEntries(MONTHS.map(m=>[m,monthAgg(m)]));

const money=v=>{const n=Math.abs(Math.round(v)).toLocaleString('en-US');return(v<0?'–$':'$')+n;};
const money2=v=>{const n=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return(v<0?'–$':'$')+n;};

function sparkline(vals,w=76,h=28,color='#1A1915'){const mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1;const p=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-mn)/r)*(h-4)-2}`).join(' ');return `<svg class="spark" width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function monthlyBars(A){const mx=Math.max(...MONTHS.map(m=>Math.max(A[m].income,A[m].expense)));return `<div class="barwrap">${MONTHS.map(m=>{const a=A[m];return `<div class="mgroup"><div class="mbars"><div class="mbar in" style="height:${a.income/mx*100}%"><span class="cap">${money(a.income)}</span></div><div class="mbar ex" style="height:${a.expense/mx*100}%"><span class="cap">${money(a.expense)}</span></div></div><div class="mlabel">${MONTH_NAMES[m].split(' ')[0]}<span class="net">net ${money(a.net)}</span></div></div>`;}).join('')}</div><div class="legend"><span><i style="background:var(--inflow)"></i>Income</span><span><i style="background:var(--outflow)"></i>Expenses</span></div>`;}
function catBars(a,limit){const e=Object.entries(a.cats).sort((x,y)=>y[1]-x[1]);const list=limit?e.slice(0,limit):e;const mx=e.length?e[0][1]:1;return list.map(([c,v])=>`<div class="catrow"><div class="top"><span>${c}</span><span class="amt num">${money(v)} <span class="pct">${Math.round(v/a.expense*100)}%</span></span></div><div class="track"><div class="fillbar" style="width:${v/mx*100}%"></div></div></div>`).join('');}

function acctSquare(f){
  const a=ACCOUNTS.find(f.match);
  const head=f.logo?`<img class="ac-logo${f.tall?' ac-card':''}" src="${f.logo}" alt="${f.label}">`:`<span class="ac-kind">${f.label}</span>`;
  if(!a)return `<div class="card acctcard missing"><div class="ac-top">${head}</div><div><div class="ac-bal" style="font-size:14px;color:var(--muted)">Not found</div><div class="ac-inst">not in Tiller yet</div></div></div>`;
  const bal=acctBalance(a);
  const kindLbl=a.kind==='cash'?'Checking':a.kind==='card'?'Credit card':a.kind==='loan'?'Loan':a.kind==='invest'?'Investment':'Account';
  return `<div class="card acctcard" data-acct-card="${a.key}"><div class="ac-top">${head}<span class="ac-arrow">→</span></div><div><div class="ac-bal num ${bal<0?'neg':'pos'}">${money(bal)}</div><div class="ac-inst">${kindLbl} · ${a.inst||''}</div></div></div>`;
}
function vDashboard(){
  const A=AGG(),a=A[current],nw=netWorth();const netSeries=MONTHS.map(m=>A[m].net);const sav=Math.round(a.net/a.income*100);
  const featured=[
    {label:'Third Federal Checking',logo:LOGO_TF,match:x=>/third federal/i.test(x.inst)&&x.kind==='cash'},
    {label:'Apple Card',logo:LOGO_APPLE,tall:true,match:x=>/apple/i.test((x.name||'')+' '+(x.inst||''))},
    {label:'Discover Card',logo:LOGO_DISCOVER,tall:true,match:x=>/discover/i.test((x.name||'')+' '+(x.inst||''))},
    {label:'AMEX Card',logo:LOGO_AMEX,tall:true,match:x=>/amex|american express/i.test((x.name||'')+' '+(x.inst||''))},
  ];
  setTimeout(()=>{document.querySelectorAll('[data-acct-card]').forEach(c=>c.onclick=()=>{TXF.account=c.dataset.acctCard;TXF.category='All';TXF.biz='All';TXF.tag='All';TXF.q='';TXF.from='';TXF.to='';active='txns';window.draw();});const nc=document.getElementById('nwCard');if(nc)nc.onclick=openNetWorthModal;wireTxnRows();},0);
  return `<div class="grid-kpi">
    <div class="card kpi hero"><div class="k-lbl">Net Cash Flow</div><div class="k-val">${money(a.net)}</div><div class="k-sub">${sav}% retained · ${money(a.capital)} to equity</div>${sparkline(netSeries)}</div>
    <div class="card kpi"><div class="k-lbl">Income</div><div class="k-val num">${money(a.income)}</div><div class="k-sub pos">ex-transfers</div></div>
    <div class="card kpi"><div class="k-lbl">Expenses</div><div class="k-val num">${money(a.expense)}</div><div class="k-sub neg">principal excluded</div></div>
    <div class="card kpi" id="nwCard" style="cursor:pointer" title="Click for a line-by-line breakdown"><div class="k-lbl">Net Worth</div><div class="k-val num">${money(nw.net)}</div><div class="k-sub">incl. property · click for detail</div></div>
  </div>
  <div class="acctgrid">${featured.map(acctSquare).join('')}</div>
  <div class="card panel"><h3>Recent Activity <span class="hint">latest 8 · fully editable</span></h3>
    <div style="overflow:auto"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Business</th><th class="r">Amount</th><th></th></tr></thead>

    if(i<steps.length-1){const ny=H-28-run*sc;bars+=`<line x1="${x+bw}" y1="${ny}" x2="${x+bw+gap}" y2="${ny}" stroke="#EAE7E1" stroke-width="1.5" stroke-dasharray="3 3"/>`;}x+=bw+gap;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${bars}</svg>`;

function vBeginning(){

  const groups=[['Assets',['bank','invest']],['Liabilities',['card','loan']]];

const billMatches=(b,ym)=>TXNS.filter(t=>t.amount<0 && t.date.slice(0,7)===ym && (!b.account||t.account_key===b.account) && b.match && t.desc.toLowerCase().includes(b.match));
function billActual(b,ym){const m=billMatches(b,ym);if(!m.length)return null;return{amount:m.reduce((s,t)=>s+(-t.amount),0),date:m.map(t=>t.date).sort().slice(-1)[0],n:m.length};}
function billDue(b,ym){const p=ym.split('-'),y=+p[0],mo=+p[1];const dim=new Date(y,mo,0).getDate();return ym+'-'+String(Math.min(Number(b.day)||1,dim)).padStart(2,'0');}
function billStatus(b,ym,todayISO){const act=billActual(b,ym);const due=billDue(b,ym);const exp=Number(b.expected)||0;let state,overBy=0;if(act){overBy=exp?(act.amount-exp)/exp:0;state=(exp&&act.amount>exp*1.15&&act.amount-exp>5)?'high':'paid';}else{state=(todayISO>due)?'missing':'due';}return{act,due,exp,state,overBy};}
function billNextDue(b){const t=new Date();const tISO=t.toISOString().slice(0,10);let ym=tISO.slice(0,7);let due=billDue(b,ym);let paid=!!billActual(b,ym);if(due<tISO||paid){const n=new Date(t.getFullYear(),t.getMonth()+1,1);ym=n.toISOString().slice(0,7);due=billDue(b,ym);paid=!!billActual(b,ym);}const days=Math.round((new Date(due+'T00:00:00')-new Date(tISO+'T00:00:00'))/86400000);return{due,days,paid,ym};}
const BSLABEL={paid:'Paid',due:'Upcoming',missing:'Missing',high:'High'};

function billCalendar(ym){
  const p=ym.split('-'),y=+p[0],mo=+p[1];
  const first=new Date(y,mo-1,1).getDay();const dim=new Date(y,mo,0).getDate();
  const todayISO=new Date().toISOString().slice(0,10);
  const byDay={};
  BILLS.forEach(b=>{const st=billStatus(b,ym,todayISO);const d=+billDue(b,ym).slice(-2);(byDay[d]=byDay[d]||[]).push({b,st});});
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=dim;d++){const items=byDay[d]||[];const iso=ym+'-'+String(d).padStart(2,'0');
    cells+=`<div class="cal-cell${iso===todayISO?' today':''}"><div class="cal-d">${d}</div>${items.map(it=>`<div class="cal-bill ${it.st.state}" title="${it.b.name} · ${it.st.act?'paid '+money(it.st.act.amount):'expected '+money(it.st.exp)}">${it.b.name}</div>`).join('')}</div>`;}
  return `<div class="cal-grid"><div class="cal-h">Sun</div><div class="cal-h">Mon</div><div class="cal-h">Tue</div><div class="cal-h">Wed</div><div class="cal-h">Thu</div><div class="cal-h">Fri</div><div class="cal-h">Sat</div>${cells}</div>`;
}

function vBills(){
  const ym=current;const todayISO=new Date().toISOString().slice(0,10);
  setTimeout(()=>{
    const ab=document.getElementById('addBill');if(ab)ab.onclick=()=>openBillModal({},true);
    document.querySelectorAll('[data-bill-edit]').forEach(b=>b.onclick=()=>openBillModal(BILLS.find(x=>x.key===b.dataset.billEdit)||{},false));
    document.querySelectorAll('[data-bill-del]').forEach(b=>b.onclick=()=>{const k=b.dataset.billDel,bl=BILLS.find(x=>x.key===k);if(!confirm('Delete bill "'+(bl?bl.name:'')+'"?'))return;BILLS=BILLS.filter(x=>x.key!==k);if(CONFIG.API_URL)api('deleteBill',{key:k}).catch(e=>console.error('bill del',e));window.draw();});
  },0);
  if(!BILLS.length){
    return `<div class="card panel" style="text-align:center;padding:44px"><div class="serif" style="font-size:21px;color:var(--ink);margin-bottom:8px">No bills tracked yet</div><div style="color:var(--muted);font-size:13px;max-width:460px;margin:0 auto 18px;line-height:1.6">Mark a recurring expense from the Transactions page — the <b>bill</b> button on any row prefills a bill from that charge. Or add one here. This page then forecasts what's due, flags missing or higher-than-expected bills, and lays the month out on a calendar.</div><button class="btn brass" id="addBill">+ Add a bill</button></div>`;
  }
  const monthlyTotal=BILLS.reduce((s,b)=>s+(Number(b.expected)||0),0);
  const soon=BILLS.map(b=>({b,nd:billNextDue(b)})).filter(x=>!x.nd.paid&&x.nd.days>=0&&x.nd.days<=7).sort((a,b)=>a.nd.days-b.nd.days);
  const statuses=BILLS.map(b=>({b,st:billStatus(b,ym,todayISO)})).sort((a,b)=>a.st.due<b.st.due?-1:1);
  const alerts=statuses.filter(x=>x.st.state==='missing'||x.st.state==='high');
  const dayLbl=n=>n===0?'today':n===1?'tomorrow':'in '+n+' days';

  let html=`<div class="grid-kpi" style="grid-template-columns:repeat(4,1fr)">
    <div class="card kpi"><div class="k-lbl">Monthly recurring</div><div class="k-val num">${money(monthlyTotal)}</div><div class="k-sub">${BILLS.length} bill${BILLS.length===1?'':'s'}</div></div>
    <div class="card kpi ${soon.length?'hero':''}"><div class="k-lbl">Due in 7 days</div><div class="k-val num">${soon.length}</div><div class="k-sub">${money(soon.reduce((s,x)=>s+(Number(x.b.expected)||0),0))} expected</div></div>
    <div class="card kpi"><div class="k-lbl">Alerts (${MONTH_NAMES[ym]||ym})</div><div class="k-val num" style="color:${alerts.length?'var(--outflow)':'inherit'}">${alerts.length}</div><div class="k-sub">missing or high</div></div>
    <div class="card kpi"><div class="k-lbl">Paid this month</div><div class="k-val num pos">${statuses.filter(x=>x.st.act).length}/${BILLS.length}</div><div class="k-sub">${money(statuses.reduce((s,x)=>s+(x.st.act?x.st.act.amount:0),0))}</div></div>
  </div>`;

  // due soon
  html+=`<div class="card panel" style="margin-bottom:12px"><h3>Due in the next 7 days</h3>`;
  if(!soon.length)html+=`<div style="color:var(--muted);font-size:13px">Nothing due in the next week.</div>`;
  else html+=soon.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><div><div style="font-size:13.5px;color:var(--ink)">${x.b.name}</div><div class="inst">${x.nd.due} · ${dayLbl(x.nd.days)}${x.b.account&&acctByKey[x.b.account]?' · '+acctByKey[x.b.account].name:''}</div></div><div class="num" style="font-weight:500">${money(Number(x.b.expected)||0)}</div></div>`).join('');
  html+=`</div>`;

  // alerts
  if(alerts.length){
    html+=`<div class="card panel" style="margin-bottom:12px"><h3>Alerts</h3>`+alerts.map(x=>{
      if(x.st.state==='missing')return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><div><span class="bs missing">Missing</span> <span style="font-size:13.5px;color:var(--ink);margin-left:6px">${x.b.name}</span><div class="inst">Due ${x.st.due} · no matching charge found this month</div></div><div class="num" style="color:var(--muted)">${money(x.st.exp)} exp.</div></div>`;
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)"><div><span class="bs high">High</span> <span style="font-size:13.5px;color:var(--ink);margin-left:6px">${x.b.name}</span><div class="inst">Paid ${money(x.st.act.amount)} vs ${money(x.st.exp)} expected · ${Math.round(x.st.overBy*100)}% over</div></div><div class="num neg" style="font-weight:500">+${money(x.st.act.amount-x.st.exp)}</div></div>`;
    }).join('')+`</div>`;
  }

  // status table for the month
  html+=`<div class="cols" style="grid-template-columns:1fr"><div class="card panel"><h3>${MONTH_NAMES[ym]||ym} — status <span class="hint">expected vs actual</span></h3>
    <table><thead><tr><th>Bill</th><th>Due</th><th class="r">Expected</th><th class="r">Actual</th><th class="r">Variance</th><th>Status</th></tr></thead><tbody>
    ${statuses.map(x=>{const v=x.st.act?x.st.act.amount-x.st.exp:0;return `<tr><td><div style="color:var(--ink)">${x.b.name}</div><div class="inst">${x.b.match}</div></td><td class="num">${x.st.due.slice(-2)}${x.b.account&&acctByKey[x.b.account]?'':''}</td><td class="r num">${money(x.st.exp)}</td><td class="r num">${x.st.act?money(x.st.act.amount):'—'}</td><td class="r num ${v>0?'neg':v<0?'pos':''}">${x.st.act&&x.st.exp?(v>0?'+':'')+money(v):'—'}</td><td><span class="bs ${x.st.state}">${BSLABEL[x.st.state]}</span></td></tr>`;}).join('')}
    </tbody></table></div></div>`;

  // calendar
  html+=`<div class="card panel" style="margin-top:12px"><h3>${MONTH_NAMES[ym]||ym} — calendar</h3>${billCalendar(ym)}
    <div class="legend" style="margin-top:12px"><span><i style="background:var(--tint-in)"></i>Paid</span><span><i style="background:#fff;border:1px dashed var(--line)"></i>Upcoming</span><span><i style="background:var(--tint-out)"></i>Missing</span><span><i style="background:var(--tint-warn)"></i>High</span></div></div>`;

  // manage
  html+=`<div class="card panel" style="margin-top:12px"><h3>Bills <span class="hint">${BILLS.length}</span></h3>
    <table><thead><tr><th>Name</th><th>Matches on</th><th>Account</th><th class="r">Expected</th><th class="r">Due day</th><th></th></tr></thead><tbody>
    ${BILLS.map(b=>`<tr><td style="color:var(--ink)">${b.name}</td><td class="inst">"${b.match}"</td><td class="inst">${b.account&&acctByKey[b.account]?acctByKey[b.account].name:'any account'}</td><td class="r num">${money(Number(b.expected)||0)}</td><td class="r num">${b.day}</td><td class="r" style="white-space:nowrap"><button class="splitbtn" data-bill-edit="${b.key}">edit</button> <button class="splitbtn" data-bill-del="${b.key}">×</button></td></tr>`).join('')}
    </tbody></table>
    <div style="margin-top:14px"><button class="btn brass" id="addBill">+ Add a bill</button></div></div>`;
  return html;
}

function billFromTxn(id){const t=TXNS.find(x=>x.id===id);if(!t)return;const clean=(t.desc||'').replace(/^PURCHASE\s+/i,'').trim();const kw=clean.toLowerCase().split(/\s+/).slice(0,2).join(' ');openBillModal({name:clean.split(/\s+/).slice(0,3).join(' ')||'New bill',match:kw,account:t.account_key||'',category:t.category||'',expected:Math.abs(t.amount)||0,day:+t.date.slice(-2)||1},true);}

function openBillModal(bill,isNew){
  const b={key:bill.key||'',name:bill.name||'',match:bill.match||'',account:bill.account||'',category:bill.category||'',expected:bill.expected||0,day:bill.day||1};
  const acctOpts=`<option value="">Any account</option>`+ACCOUNTS.map(a=>`<option value="${a.key}" ${a.key===b.account?'selected':''}>${a.name}</option>`).join('');
  const catOpts=`<option value="">— none —</option>`+CATS.map(c=>`<option ${c===b.category?'selected':''}>${c}</option>`).join('');
  document.getElementById('modalHost').innerHTML=`<div class="overlay" id="ov"><div class="modal"><div class="mh"><h3>${isNew?'New recurring bill':'Edit bill'}</h3><button class="close" id="mx">×</button></div><div class="mb">
    <div class="fr"><div class="fld" style="min-width:100%"><label>Name</label><input type="text" id="bfName" value="${b.name.replace(/"/g,'&quot;')}" placeholder="e.g. Duke Energy"></div></div>
    <div class="fr"><div class="fld" style="min-width:100%"><label>Match transactions containing</label><input type="text" id="bfMatch" value="${b.match.replace(/"/g,'&quot;')}" placeholder="e.g. duke energy"></div></div>
    <div class="fr"><div class="fld"><label>Expected amount</label><input type="number" id="bfExp" value="${b.expected}" style="text-align:right"></div><div class="fld" style="max-width:110px"><label>Due day</label><input type="number" id="bfDay" value="${b.day}" min="1" max="31" style="text-align:right"></div></div>
    <div class="fr"><div class="fld"><label>Account</label><select id="bfAcct">${acctOpts}</select></div><div class="fld"><label>Category</label><select id="bfCat">${catOpts}</select></div></div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">The match is a keyword the app looks for in each transaction's description to know this bill was paid. Keep it short and distinctive.</div>
    <div style="display:flex;gap:8px;margin-top:6px"><div style="flex:1"></div><button class="btn brass" id="bfSave">${isNew?'Add bill':'Save'}</button></div>
  </div></div></div>`;
  const close=()=>document.getElementById('modalHost').innerHTML='';
  document.getElementById('mx').onclick=close;document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')close();};
  document.getElementById('bfSave').onclick=()=>{
    const name=(document.getElementById('bfName').value||'').trim();
    const match=(document.getElementById('bfMatch').value||'').trim().toLowerCase();
    if(!name){alert('Give the bill a name.');return;}
    if(!match){alert('Enter a match keyword so the app can find this bill\u2019s charges.');return;}
    const rec={key:b.key||slugKey(name),name:name,match:match,account:document.getElementById('bfAcct').value,category:document.getElementById('bfCat').value,expected:parseFloat(document.getElementById('bfExp').value)||0,day:parseInt(document.getElementById('bfDay').value,10)||1};
    const ix=BILLS.findIndex(x=>x.key===rec.key);if(ix>=0)BILLS[ix]=rec;else BILLS.push(rec);
    if(CONFIG.API_URL)api('saveBill',{key:rec.key,name:rec.name,match:rec.match,account:rec.account,category:rec.category,expected:rec.expected,day:rec.day}).catch(e=>console.error('bill save',e));
    close();window.draw();
  };
}

/* ============================================================ ROUTER */
const VIEWS=[
  {id:'dash',label:'Dashboard',sec:'Reports',crumb:'Overview',month:true,render:vDashboard},
  {id:'flow',label:'Cash Flow',sec:'Reports',crumb:'Reports',month:true,render:vCashflow},
  {id:'cats',label:'Categories',sec:'Reports',crumb:'Reports',month:true,render:vCategories},
  {id:'tags',label:'Tags',sec:'Reports',crumb:'Tags',month:false,render:vTags},
  {id:'accts',label:'Accounts',sec:'Ledger',crumb:'Balances',month:false,render:vAccounts},
  {id:'txns',label:'Transactions',sec:'Ledger',crumb:'Ledger',month:false,render:vTransactions},
  {id:'wallet',label:'Cash Wallet',sec:'Ledger',crumb:'Ledger',month:true,render:vWallet},
  {id:'bills',label:'Bills',sec:'Ledger',crumb:'Bills',month:true,render:vBills},
  {id:'new',label:'New Activity',sec:'Ledger',crumb:'Review',month:false,render:vNewActivity,badge:true},
  {id:'rules',label:'Categorization',sec:'Setup',crumb:'Setup',month:false,render:vCategorization},
  {id:'import',label:'Import',sec:'Setup',crumb:'Setup',month:false,render:vImport},
  {id:'begin',label:'Beginning Balances',sec:'Setup',crumb:'Setup',month:false,render:vBeginning},
  {id:'prop',label:'Property & Assets',sec:'Setup',crumb:'Setup',month:false,render:vProperty},
];
let active='dash';
function newCount(){let n=0;TXNS.forEach(t=>{if(new Date(t.seenAt)>watermark&&!t.reviewed)n++;});return n;}
function renderNav(){
  const secs=[...new Set(VIEWS.map(v=>v.sec))];
  document.getElementById('nav').innerHTML=secs.map(sec=>`<div class="navsec">${sec}</div>`+VIEWS.filter(v=>v.sec===sec).map(v=>`<button class="nav-item ${v.id===active?'active':''}" data-id="${v.id}">${v.label}${v.badge&&newCount()?`<span class="badge">${newCount()}</span>`:''}${v.id==='prop'&&valuationsDue()?`<span class="badge">${valuationsDue()}</span>`:''}</button>`).join('')).join('');
  document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{active=b.dataset.id;draw();});
}
function draw(){
  const v=VIEWS.find(x=>x.id===active);
  document.getElementById('title').textContent=v.label;
  document.getElementById('crumb').textContent=v.crumb;
  document.getElementById('monthsel').style.visibility=v.month?'visible':'hidden';
  document.getElementById('mlbl').textContent=MONTH_NAMES[current];
  document.getElementById('prev').disabled=MONTHS.indexOf(current)===0;
  document.getElementById('next').disabled=MONTHS.indexOf(current)===MONTHS.length-1;
  document.getElementById('content').innerHTML=`<div class="view">${v.render()}</div>`;
  renderNav();
}
window.draw=draw;
document.getElementById('prev').onclick=()=>{const i=MONTHS.indexOf(current);if(i>0){current=MONTHS[i-1];draw();}};
document.getElementById('next').onclick=()=>{const i=MONTHS.indexOf(current);if(i<MONTHS.length-1){current=MONTHS[i+1];draw();}};
boot();
</script>
