<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Household Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16202B;--ink2:#22303F;--paper:#ECEFF2;--card:#FFFFFF;--line:#DBE1E7;--text:#2E3A45;--muted:#77848F;
    --brass:#B98F32;--inflow:#1E7A61;--outflow:#B0503A;--warn:#B07A1E;--equity:#2C5F8A;
    --shadow:0 1px 2px rgba(22,32,43,.04),0 4px 16px rgba(22,32,43,.05);}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--text);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
  .num{font-variant-numeric:tabular-nums}.serif{font-family:'Spectral',Georgia,serif}
  .pos{color:var(--inflow)}.neg{color:var(--outflow)}.eq{color:var(--equity)}

  .side{width:236px;flex-shrink:0;background:var(--ink);color:#C7D0D9;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .brand .mark{font-family:'Spectral',serif;font-weight:600;font-size:21px;color:#F3F0E8;display:flex;align-items:center;gap:9px}
  .brand .mark::before{content:"";width:9px;height:20px;background:var(--brass);border-radius:1px}
  .brand .sub{font-size:11px;color:#6E7C88;margin-top:5px;letter-spacing:.08em;text-transform:uppercase}
  nav{padding:8px 12px;flex:1;overflow-y:auto}
  .navsec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5D6B77;padding:11px 12px 4px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#AEB9C4;font-family:inherit;font-size:13.5px;padding:8px 12px;border-radius:7px;cursor:pointer;border-left:2px solid transparent;margin:1px 0;transition:background .15s,color .15s}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#E4EAEF}
  .nav-item.active{background:rgba(185,143,50,.10);color:#F5F1E7;border-left-color:var(--brass)}
  .nav-item .badge{margin-left:auto;background:var(--brass);color:#241C06;font-size:10.5px;font-weight:600;border-radius:10px;padding:1px 7px}
  .side-foot{padding:13px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6E7C88;line-height:1.5}
  .side-foot b{color:#9FB0BC;font-weight:500}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--inflow);margin-right:6px;box-shadow:0 0 0 3px rgba(30,122,97,.18)}

  main{flex:1;min-width:0;display:flex;flex-direction:column}
  .demo{background:#FBF3E4;color:#7A5610;font-size:12px;text-align:center;padding:5px;border-bottom:1px solid #EBD9B4}
  .demo code{background:#F2E6C9;padding:1px 5px;border-radius:4px}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:24px 32px 16px;border-bottom:1px solid var(--line)}
  .topbar .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .topbar h1{font-family:'Spectral',serif;font-weight:600;font-size:25px;color:var(--ink)}
  .topbar .rule{height:2px;width:42px;background:var(--brass);margin-top:8px;border-radius:2px}
  .monthsel{display:flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:var(--shadow)}
  .monthsel button{background:none;border:0;cursor:pointer;color:var(--ink);width:30px;height:30px;border-radius:6px;font-size:16px;display:grid;place-items:center}
  .monthsel button:hover:not(:disabled){background:var(--paper)}
  .monthsel button:disabled{opacity:.28;cursor:default}
  .monthsel .lbl{font-weight:600;font-size:13.5px;min-width:96px;text-align:center;color:var(--ink)}
  .content{padding:24px 32px 50px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .panel{padding:18px 20px}
  .panel h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .panel h3 .hint{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--muted)}
  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{padding:16px 18px;position:relative;overflow:hidden}
  .kpi .k-lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .k-val{font-family:'Spectral',serif;font-size:27px;font-weight:600;margin-top:8px;color:var(--ink);line-height:1}
  .kpi .k-sub{font-size:12px;color:var(--muted);margin-top:7px}
  .kpi.hero{background:var(--ink);border-color:var(--ink)}
  .kpi.hero .k-lbl{color:#93A2AE}.kpi.hero .k-val{color:#F5F1E7;font-size:31px}.kpi.hero .k-sub{color:#93A2AE}
  .spark{position:absolute;right:14px;bottom:12px;opacity:.9}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}

  .barwrap{display:flex;align-items:flex-end;gap:24px;height:170px;padding:6px 4px 0}
  .mgroup{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
  .mbars{flex:1;display:flex;align-items:flex-end;gap:6px;width:100%;justify-content:center}
  .mbar{width:24px;border-radius:3px 3px 0 0;position:relative;transition:height .6s cubic-bezier(.2,.7,.2,1)}
  .mbar.in{background:var(--inflow)}.mbar.ex{background:var(--outflow)}
  .mbar .cap{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
  .mlabel{font-size:12px;color:var(--muted)}.mlabel .net{display:block;font-weight:600;color:var(--ink);font-size:12px;margin-top:2px}
  .legend{display:flex;gap:16px;margin-top:2px;font-size:12px;color:var(--muted)}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}

  .catrow{margin-bottom:12px}
  .catrow .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .catrow .top .amt{color:var(--ink);font-weight:500}
  .track{height:8px;background:var(--paper);border-radius:5px;overflow:hidden}
  .fillbar{height:100%;background:var(--outflow);border-radius:5px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .catrow .pct{color:var(--muted);font-size:11px}

  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:0 10px 9px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#F7F9FB}
  .r{text-align:right}.amtcell{font-weight:500}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--paper);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
  .pill.transfer{color:var(--muted);font-style:italic}
  .cat{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:#E7F1EC;color:var(--inflow);font-weight:500;white-space:nowrap}
  .cat.inc{background:#E7EFF4;color:#2C5F8A}.cat.none{background:#F3EFE4;color:var(--warn)}.cat.cap{background:#E7EFF4;color:var(--equity)}
  .inst{color:var(--muted);font-size:11.5px}
  .splitline td{padding-top:2px;padding-bottom:2px;font-size:12px;background:#FAFBFC}
  .splitline .lead{color:var(--muted);padding-left:22px}
  .splitbtn{font-size:11px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer}
  .splitbtn:hover{background:var(--paper);color:var(--ink)}
  .haslead{display:inline-block;width:14px;color:var(--muted)}

  .acct-group{margin-bottom:12px}
  .acct-group .gh{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 11px;border-bottom:1px solid var(--line);margin-bottom:5px}
  .acct-group .gh .gt{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .acct-group .gh .gs{font-family:'Spectral',serif;font-size:16px;color:var(--ink)}
  .acct{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}
  .acct .an{font-size:13.5px;color:var(--ink)}.acct .ai{font-size:11.5px;color:var(--muted);margin-top:1px}
  .acct .ab{font-family:'Spectral',serif;font-size:14.5px}
  .networth{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;margin-top:6px;background:var(--ink);border-radius:12px;color:#fff}
  .networth .nl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#93A2AE}
  .networth .nv{font-family:'Spectral',serif;font-size:26px;color:#F5F1E7}

  .filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  select,input[type=text],input[type=number],input[type=date]{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
  select:focus,input:focus{outline:2px solid var(--brass);outline-offset:1px}
  .btn{font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .btn:hover{background:var(--paper)}
  .btn.primary{background:var(--ink);color:#F5F1E7;border-color:var(--ink)}.btn.primary:hover{background:var(--ink2)}
  .btn.brass{background:var(--brass);color:#241C06;border-color:var(--brass);font-weight:600}
  .btn.sm{padding:5px 9px;font-size:11.5px}

  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
  .st.tied{background:#E7F1EC;color:var(--inflow)}.st.off{background:#FBE9E4;color:var(--outflow)}
  .st.man{background:#EDEFF1;color:var(--muted)}.st.mkt{background:#E7EFF4;color:#2C5F8A}
  .need{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#F3EFE4;color:var(--warn);font-weight:500}
  .tieout{display:flex;align-items:center;gap:10px;border-radius:10px;padding:11px 15px;margin-bottom:16px;font-size:13px;background:#E7F1EC;border:1px solid #CBE3D7;color:#1B5E4A}
  .tieout.warn{background:#FBF3E4;border-color:#EBD9B4;color:#7A5610}

  .batch{margin-bottom:12px;overflow:hidden}
  .bh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;flex-wrap:wrap}
  .bh .src{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--ink);font-size:13.5px}
  .bh .chip{width:8px;height:18px;border-radius:2px}.chip.sf{background:var(--inflow)}.chip.csv{background:var(--brass)}.chip.man{background:var(--equity)}
  .bh .meta{font-size:11.5px;color:var(--muted)}

  .asset{padding:16px 18px;margin-bottom:12px}
  .aval{font-family:'Spectral',serif;font-size:22px;color:var(--ink)}
  .stale{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:4px;font-weight:500}
  .stale.ok{background:#E7F1EC;color:var(--inflow)}.stale.old{background:#FBF3E4;color:var(--warn)}
  .equity{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .equity .e{font-size:12px;color:var(--muted)}.equity .e b{font-family:'Spectral',serif;font-size:14px;color:var(--ink);display:block;margin-top:2px}

  .drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:13px}
  .fr{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
  .fr .fld{flex:1;min-width:96px}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .summ{display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap}.summ .s b{font-family:'Spectral',serif;font-size:19px;display:block}.summ .s{font-size:12px;color:var(--muted)}
  tr.dup{background:#F6F7F8;color:var(--muted)}.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:500}
  .tag.new{background:#E7F1EC;color:var(--inflow)}.tag.dup{background:#EDEFF1;color:var(--muted)}.tag.transfer{background:#E7EFF4;color:var(--equity)}
  .ck{width:15px;height:15px;accent-color:var(--brass)}

  .overlay{position:fixed;inset:0;background:rgba(22,32,43,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--card);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:88vh;overflow:auto}
  .modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{font-family:'Spectral',serif;font-size:18px;color:var(--ink)}
  .modal .mb{padding:18px 22px}
  .modal .close{border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
  .alloc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:13px;margin-top:6px}
  .alloc.ok{color:var(--inflow)}.alloc.bad{color:var(--outflow)}

  .view{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (max-width:820px){
    body{flex-direction:column}.side{width:100%;height:auto;position:static}
    nav{display:flex;overflow-x:auto;padding:8px}.navsec{display:none}
    .nav-item{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}
    .nav-item.active{border-left:0;border-bottom-color:var(--brass)}.side-foot{display:none}
    .grid-kpi{grid-template-columns:repeat(2,1fr)}.topbar{padding:18px}.content{padding:18px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><div class="mark">Ledger</div><div class="sub">Household Finance</div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div><span class="dot"></span><b>SimpleFIN + CSV + Cash</b></div><div style="margin-top:4px" id="footInfo"></div></div>
  </aside>
  <main>
    <div class="demo" id="demoBar"></div>
    <div class="topbar">
      <div><div class="eyebrow" id="crumb"></div><h1 id="title"></h1><div class="rule"></div></div>
      <div class="monthsel" id="monthsel"><button id="prev">‹</button><span class="lbl num" id="mlbl"></span><button id="next">›</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
  <div id="modalHost"></div>

<script>
/* ============================================================ CONFIG */
const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbwC4NYnpimCWaM11bCeDjQGToA668lOTrXm6V9L2MQ5g8GUibusfYgPZMmyUCuzXhJxMw/exec'};

/* ============================================================ DATA MODEL */
const MONTHS=['2026-05','2026-06','2026-07'];
const MONTH_NAMES={'2026-05':'May 2026','2026-06':'June 2026','2026-07':'July 2026'};
let current='2026-07';
let watermark=new Date('2026-07-05T08:12:00');
const NOW=new Date('2026-07-12T14:30:00');
const IMPORT_SEEN='2026-07-12T10:30:00';

const CAPITAL_CATEGORIES=['Mortgage Principal','Loan Principal','Investment Contribution'];
const INCOME=new Set(['Consulting Income','Interest Income']);
const CATS=['Groceries','Dining','Gas & Auto','Shopping','Subscriptions','Utilities','Housing','Mortgage Interest','Real Estate Tax','Homeowners Insurance','Loan Payment','Childcare','Insurance','Healthcare','Entertainment','Travel','Transportation','Bank Fee','Cash Spending','Consulting Income','Interest Income'];

const ACCOUNTS=[
  {key:'huntington-chk',name:'Huntington — Checking',inst:'Huntington',group:'bank',kind:'cash',begin:11400,asOf:'2026-05-01'},
  {key:'huntington-sav',name:'Huntington — Savings',inst:'Huntington',group:'bank',kind:'cash',begin:41150,asOf:'2026-05-01'},
  {key:'53-chk',name:'Fifth Third — Joint Checking',inst:'Fifth Third',group:'bank',kind:'cash',begin:5900,asOf:'2026-05-01'},
  {key:'cash-wallet',name:'Cash Wallet',inst:'Cash',group:'bank',kind:'manual',begin:60,asOf:'2026-05-01'},
  {key:'fidelity-brk',name:'Fidelity — Brokerage',inst:'Fidelity',group:'invest',kind:'invest',begin:119000,asOf:'2026-05-01',feed:128400},
  {key:'vanguard-ira',name:'Vanguard — Roth IRA',inst:'Vanguard',group:'invest',kind:'invest',begin:92000,asOf:'2026-05-01',feed:96750},
  {key:'empower-401',name:'Empower — 401(k)',inst:'Empower',group:'invest',kind:'invest',begin:205000,asOf:'2026-05-01',feed:214300},
  {key:'chase-sapphire',name:'Chase — Sapphire Reserve',inst:'Chase',group:'card',kind:'card',begin:-2900,asOf:'2026-05-01'},
  {key:'amex-gold',name:'Amex — Gold',inst:'American Express',group:'card',kind:'card',begin:-1950,asOf:'2026-05-01'},
  {key:'capone',name:'Capital One — Venture',inst:'Capital One',group:'card',kind:'card',begin:-1600,asOf:'2026-05-01'},
  {key:'citi',name:'Citi — Double Cash',inst:'Citi',group:'card',kind:'card',begin:-740,asOf:'2026-05-01'},
  {key:'apple-card',name:'Apple Card',inst:'Apple',group:'card',kind:'manual',begin:-430,asOf:'2026-05-01'},
  {key:'rocket-mtg',name:'Rocket — Home Mortgage',inst:'Rocket Mortgage',group:'loan',kind:'loan',begin:-313000,asOf:'2026-05-01'},
  {key:'ally-auto',name:'Ally — Auto Loan',inst:'Ally',group:'loan',kind:'loan',begin:-18800,asOf:'2026-05-01'},
  {key:'sofi',name:'SoFi — Personal Loan',inst:'SoFi',group:'loan',kind:'loan',begin:-9750,asOf:'2026-05-01'},
  {key:'nelnet',name:'Nelnet — Student Loan',inst:'Nelnet',group:'loan',kind:'loan',begin:-22850,asOf:'2026-05-01'},
];
const acctByKey=Object.fromEntries(ACCOUNTS.map(a=>[a.key,a]));
const acctName=k=>(acctByKey[k]&&acctByKey[k].name)||k||'Unknown account';

let RULES=[
  {pattern:'KROGER',category:'Groceries'},{pattern:'GIANT EAGLE',category:'Groceries'},{pattern:'WHOLEFDS',category:'Groceries'},{pattern:'COSTCO',category:'Groceries'},
  {pattern:'DOORDASH',category:'Dining'},{pattern:'STARBUCKS',category:'Dining'},{pattern:'CHIPOTLE',category:'Dining'},
  {pattern:'SHELL',category:'Gas & Auto'},{pattern:'GETGO',category:'Gas & Auto'},{pattern:'MARATHON',category:'Gas & Auto'},
  {pattern:'NETFLIX',category:'Subscriptions'},{pattern:'SPOTIFY',category:'Subscriptions'},{pattern:'ADOBE',category:'Subscriptions'},{pattern:'ANTHROPIC',category:'Subscriptions'},
  {pattern:'AMZN',category:'Shopping'},{pattern:'TARGET',category:'Shopping'},{pattern:'APPLE STORE',category:'Shopping'},
  {pattern:'ROCKET MORTGAGE',category:'Housing'},{pattern:'ALLY',category:'Loan Payment'},{pattern:'NELNET',category:'Loan Payment'},{pattern:'SOFI',category:'Loan Payment'},
  {pattern:'BRIGHT HORIZONS',category:'Childcare'},{pattern:'STATE FARM',category:'Insurance'},
  {pattern:'AEP OHIO',category:'Utilities'},{pattern:'SPECTRUM',category:'Utilities'},{pattern:'COLUMBUS',category:'Utilities'},
  {pattern:'LTC ADVISORY',category:'Consulting Income'},{pattern:'CASTLEREAGH',category:'Consulting Income'},{pattern:'INTEREST',category:'Interest Income'},
  {pattern:'ATM WITHDRAWAL',category:'Transfer'},{pattern:'PAYMENT -',category:'Transfer'},{pattern:'TRANSFER TO',category:'Transfer'},
];

const VALUED=[
  {key:'primary-home',name:'Primary Residence',type:'real_estate',link:'rocket-mtg',history:[['2025-01-01',415000],['2025-07-01',428000],['2026-01-01',442000]]},
  {key:'tesla-my',name:'2023 Tesla Model Y',type:'vehicle',link:'ally-auto',history:[['2025-01-01',38000],['2025-07-01',34500],['2026-01-01',31000]]},
  {key:'runner',name:'2019 Toyota 4Runner',type:'vehicle',link:'',history:[['2025-01-01',32000],['2026-05-01',29500]]},
];

let _id=0, _s=987654321;
const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;};
const pick=a=>a[Math.floor(rnd()*a.length)];
const jit=(b,p)=>Math.round(b*(1+(rnd()*2-1)*p));
const CARDS=['chase-sapphire','amex-gold','capone','citi'];
const SPEND=[

function effectiveLines(t){
  if(SPLITS[t.id])return SPLITS[t.id].map(s=>({category:s.category,amount:s.amount,cls:s.cls}));
  const cls=t.transfer?'transfer':CAPITAL_CATEGORIES.includes(t.category)?'capital':t.amount>0?'income':'expense';

}
const acctTxnSum=key=>TXNS.filter(t=>t.account_key===key).reduce((s,t)=>s+t.amount,0);

function monthAgg(m){
  let income=0,expense=0,capital=0;const cats={};
  TXNS.filter(t=>t.date.startsWith(m)).forEach(t=>{
    effectiveLines(t).forEach(l=>{
      if(l.cls==='transfer')return;
      if(l.cls==='income'){income+=l.amount;return;}
      if(l.cls==='capital'){capital+=-l.amount;return;}
      expense+=-l.amount;const c=l.category||'Uncategorized';cats[c]=(cats[c]||0)+(-l.amount);

}

function waterfall(m,A){

  const cats=Object.entries(a.cats).sort((x,y)=>y[1]-x[1]);const top=cats.slice(0,5);const other=cats.slice(5).reduce((s,x)=>s+x[1],0);

  const W=800,H=250,pad=28,bw=48,gap=(W-pad*2-bw*steps.length)/(steps.length-1);

  steps.forEach((s,i)=>{let y,h,fill;if(s.t==='tot'){h=s.v*sc;y=H-28-h;fill=i===0?'#22303F':'#16202B';run=s.v;}else if(s.t==='pos'){h=s.v*sc;y=H-28-(run+s.v)*sc;fill='var(--inflow)';run+=s.v;}else if(s.t==='cap'){h=-s.v*sc;y=H-28-run*sc;fill='var(--equity)';run+=s.v;}else{h=-s.v*sc;y=H-28-run*sc;fill='var(--outflow)';run+=s.v;}

};
let imp={headers:[],rows:[],adapter:ADAPTERS.apple,map:{},flip:true};
function parseCSV(text){const rows=[];let row=[],f='',i=0,q=false;text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');while(i<text.length){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else f+=c;}i++;}if(f.length||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x!==''));}
const normd=s=>(s||'').toUpperCase().replace(/^PURCHASE\s+/,'').replace(/[^A-Z0-9]/g,'').slice(0,6);
function existingKeys(){const set={};TXNS.forEach(t=>{set[t.account_key+'|'+t.date+'|'+Number(t.amount).toFixed(2)+'|'+normd(t.desc)]=true;});return set;}
function toISO(s){s=(s||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];return s;}
function findCol(cands){for(const c of cands){const i=imp.headers.findIndex(h=>h.toLowerCase().includes(c));if(i>=0)return i;}return -1;}
function vImport(){
  setTimeout(()=>{
    const g=id=>document.getElementById(id);
    g('impAcct').onchange=()=>{imp.adapter=ADAPTERS[g('impAcct').value];g('impNote').textContent=imp.adapter.note;if(imp.rows.length)buildImport();};
    g('impNote').textContent=imp.adapter.note;
    document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{g('impAcct').value=b.dataset.sample;imp.adapter=ADAPTERS[b.dataset.sample];ingestCSV(SAMPLES[b.dataset.sample]);});
    const fi=g('impFile');if(fi)fi.onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>ingestCSV(r.result);r.readAsText(f);}};
  },0);
  return `<div class="card panel"><h3>Import transactions <span class="hint">backfill &amp; manual accounts</span></h3>
    <div class="fr"><div class="fld" style="max-width:280px"><label>Institution</label><select id="impAcct"><option value="apple">Apple Card — manual only</option><option value="chase">Chase — Sapphire Reserve</option><option value="amex">Amex — Gold</option><option value="huntington">Huntington — Checking</option><option value="generic">Other — auto-detect</option></select></div>
    <div class="fld" style="flex:2"><div class="inst" id="impNote"></div></div></div>
    <div class="drop"><b style="color:var(--ink)">Drop a CSV</b> or <label style="color:var(--brass);cursor:pointer;text-decoration:underline">browse<input type="file" id="impFile" accept=".csv" style="display:none"></label> — parsed in your browser</div>
    <div style="display:flex;gap:9px;margin-top:12px"><button class="btn" data-sample="apple">Sample · Apple Card</button><button class="btn" data-sample="chase">Sample · Chase (overlaps sync)</button></div>
  </div>
  <div id="impResult"></div>`;
}
function ingestCSV(text){const parsed=parseCSV(text);if(parsed.length<2){alert('No data rows.');return;}imp.headers=parsed[0].map(h=>h.trim());imp.rows=parsed.slice(1);buildImport();}
function buildImport(){
  imp.map={date:findCol(['transaction date','trans date','date','posted']),desc:findCol(['merchant','description','payee','name']),amount:findCol(['amount (usd)','amount','debit']),type:findCol(['type']),category:findCol(['category'])};
  imp.flip=!!imp.adapter.flip;renderImport();
}
function normalizeImport(){
  const flip=imp.flip?-1:1;const seen=existingKeys();
  return imp.rows.map(r=>{
    const amt=(parseFloat((r[imp.map.amount]||'').replace(/[$,]/g,''))||0)*flip;
    const desc=(r[imp.map.desc]||'').trim();const date=toISO(r[imp.map.date]||'');
    const typeVal=imp.map.type>=0?(r[imp.map.type]||''):'';const isPay=imp.adapter.paymentValue&&typeVal.toLowerCase()===imp.adapter.paymentValue.toLowerCase();
    const cat=(imp.adapter.keepCategory&&imp.map.category>=0)?(r[imp.map.category]||'').trim():'';
    const key=imp.adapter.accountKey+'|'+date+'|'+amt.toFixed(2)+'|'+normd(desc);
    let status=isPay?'transfer':(seen[key]?'dup':'new');
    return{date,desc,amount:amt,category:cat,transfer:isPay,status,key};
  }).filter(r=>r.date);
}
function renderImport(){
  const rows=normalizeImport();const nNew=rows.filter(r=>r.status==='new').length,nDup=rows.filter(r=>r.status==='dup').length,nX=rows.filter(r=>r.status==='transfer').length;
  document.getElementById('impResult').innerHTML=`<div class="card panel" style="margin-top:14px"><h3>Review &amp; commit</h3>
    <div class="summ"><div class="s"><b class="pos">${nNew}</b>new</div><div class="s"><b style="color:var(--equity)">${nX}</b>transfers</div><div class="s"><b style="color:var(--muted)">${nDup}</b>duplicates</div><div class="s"><b>${rows.length}</b>rows</div></div>
    <div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th></th><th>Date</th><th>Description</th><th>Category</th><th>Status</th><th class="r">Amount</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.status==='dup'?'dup':''}"><td><input type="checkbox" class="ck" data-i="${i}" ${r.status!=='dup'?'checked':''}></td><td class="num">${r.date}</td><td>${r.desc}</td><td>${r.category?`<span class="pill">${r.category}</span>`:'<span class="inst">—</span>'}</td><td><span class="tag ${r.status}">${r.status==='new'?'New':r.status==='dup'?'Duplicate':'Transfer'}</span></td><td class="r num ${r.amount<0?'neg':'pos'}">${money2(r.amount)}</td></tr>`).join('')}</tbody></table></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap"><div class="inst">Duplicates unchecked by default. Committed rows land in your ledger and appear in New Activity.</div><button class="btn primary" id="impCommit">Commit selected</button></div></div>`;
  window._impRows=rows;
  document.getElementById('impCommit').onclick=()=>{
    const ak=imp.adapter.accountKey;
    if(!acctByKey[ak]){alert('Can\u2019t commit: account_key "'+ak+'" is not in your Accounts tab. Add a row for it (account_key '+ak+') in the sheet, reload, then import again.');return;}
    const checks=[...document.querySelectorAll('#impResult .ck')];const sel=checks.filter(c=>c.checked).map(c=>window._impRows[+c.dataset.i]);
    if(!sel.length){alert('Nothing selected to commit \u2014 all rows may be flagged as duplicates.');return;}
    const src='csv:'+document.getElementById('impAcct').value;const acct=acctByKey[ak];
    if(CONFIG.API_URL){
      const btn=document.getElementById('impCommit');btn.disabled=true;btn.textContent='Saving '+sel.length+'\u2026';
      const payloadRows=sel.map(r=>({account_key:ak,account_name:acct?acct.name:'',institution:acct?acct.inst:'',posted_date:r.date,amount:r.amount,description:r.desc,category:r.transfer?'Transfer':(r.category||''),source:src,dedup_key:r.key,sync_date:new Date().toISOString(),reviewed:''}));
      postImport({action:'importTxns',rows:payloadRows}).then(async()=>{imp.rows=[];await loadLive();active='new';window.draw();}).catch(e=>{console.error(e);alert('Import save failed \u2014 see console. Nothing was changed.');btn.disabled=false;btn.textContent='Commit selected';});
    } else {
      sel.forEach(r=>{const id=_id++;TXNS.push({id,date:r.date,account_key:ak,desc:r.desc,amount:r.amount,source:src,seenAt:IMPORT_SEEN,category:r.transfer?'Transfer':r.category,transfer:r.transfer,manualCat:!!(r.transfer||r.category)});});
      runRules();TXNS.sort((a,b)=>a.date<b.date?1:-1);imp.rows=[];active='new';window.draw();
    }
  };
}
  function api(action,params){return new Promise((res,rej)=>{const cb='cb'+Math.random().toString(36).slice(2);
  window[cb]=d=>{res(d);delete window[cb];sc.remove();};const sc=document.createElement('script');
  sc.onerror=()=>rej(new Error(action));const q=Object.entries(params||{}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  sc.src=CONFIG.API_URL+'?action='+action+(q?'&'+q:'')+'&callback='+cb;document.body.appendChild(sc);});}
function persistTxn(t,changes){ if(!CONFIG.API_URL||!t.dedup_key)return; api('updateTxn',Object.assign({key:t.dedup_key},changes)).catch(e=>console.error('save failed',e)); }
function saveCategory(name){ if(CATS.indexOf(name)<0)CATS.push(name); if(CONFIG.API_URL)api('addCategory',{name:name}).catch(e=>console.error('cat save',e)); }
function saveRuleCat(i,cat){ if(RULES[i]){const p=RULES[i].pattern;RULES[i].category=cat; if(CONFIG.API_URL)api('updateRuleCat',{pattern:p,category:cat}).catch(e=>console.error('rule save',e));} }
function removeRule(i){ if(RULES[i]){const p=RULES[i].pattern;RULES.splice(i,1); if(CONFIG.API_URL)api('deleteRule',{pattern:p}).catch(e=>console.error('rule del',e));} }
function saveNewRule(pattern,cat){ const P=pattern.toUpperCase();RULES.push({pattern:P,category:cat}); if(CONFIG.API_URL)api('addRule',{pattern:P,category:cat}).catch(e=>console.error('rule add',e)); }
  function postImport(payload){return fetch(CONFIG.API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});}
  function jsonp(name){return new Promise((res,rej)=>{const cb='cb'+Math.random().toString(36).slice(2);
     window[cb]=d=>{res(d);delete window[cb];sc.remove();};const sc=document.createElement('script');
     sc.onerror=()=>rej(new Error('fetch '+name));sc.src=CONFIG.API_URL+'?action=getSheet&name='+name+'&callback='+cb;
     document.body.appendChild(sc);});}
   const _nd=s=>(s||'').toUpperCase().replace(/^PURCHASE\s+/,'').replace(/[^A-Z0-9]/g,'').slice(0,6);
   async function loadLive(){
     const [tx,ac,ru,bb,asset,av,sp,cat]=await Promise.all(
       ['Transactions','Accounts','Rules','BeginningBalances','Assets','AssetValues','Splits','Categories'].map(jsonp));
     const anchor=Object.fromEntries(bb.map(r=>[r.account_key,r]));
     ACCOUNTS.length=0;
     ac.forEach(r=>{const a=anchor[r.account_key]||{};const manual=(!r.simplefin_id&&(r.type==='card'||r.type==='wallet'));
       ACCOUNTS.push({key:r.account_key,name:r.name,inst:r.institution,
         group:r.type==='wallet'?'bank':r.type,
         kind:r.type==='wallet'?'manual':r.type==='invest'?'invest':r.type==='loan'?'loan':manual?'manual':r.type==='card'?'card':'cash',
         begin:Number(a.beginning_balance)||0,asOf:String(a.as_of_date||'').slice(0,10),feed:Number(r.balance)});});
     Object.keys(acctByKey).forEach(k=>delete acctByKey[k]);ACCOUNTS.forEach(a=>acctByKey[a.key]=a);
     RULES=ru.map(r=>({pattern:String(r.pattern),category:r.category}));
     (cat||[]).forEach(r=>{const c=r.category;if(c&&CATS.indexOf(c)<0)CATS.push(c);});
     TXNS=tx.map((r,i)=>({id:i,date:String(r.posted_date).slice(0,10),account_key:r.account_key,desc:r.description,
       amount:Number(r.amount),source:r.source,seenAt:r.sync_date,category:r.category||'',
       transfer:r.category==='Transfer',manualCat:true,
       dedup_key:r.dedup_key,reviewed:(r.reviewed==='yes'||r.reviewed===true)}));
     const keyOf=t=>t.account_key+'|'+t.date+'|'+Number(t.amount).toFixed(2)+'|'+_nd(t.desc);
     const byKey={};TXNS.forEach(t=>byKey[keyOf(t)]=t.id);
     SPLITS={};sp.forEach(r=>{const base=String(r.parent_dedup_key).split('|').slice(0,4).join('|');
       const id=byKey[base];if(id!=null)(SPLITS[id]=SPLITS[id]||[]).push({category:r.category,amount:Number(r.amount),cls:r.class});});
     const hist={};av.forEach(r=>{(hist[r.asset_key]=hist[r.asset_key]||[]).push([String(r.as_of_date).slice(0,10),Number(r.value)]);});
     VALUED.length=0;asset.forEach(r=>{const h=(hist[r.asset_key]||[]).sort((a,b)=>a[0]<b[0]?-1:1);
       VALUED.push({key:r.asset_key,name:r.name,type:r.type,link:r.linked_liability_key||'',history:h.length?h:[['2026-01-01',0]]});});
   }
  async function boot(){
  if(CONFIG.API_URL){try{await loadLive();}catch(e){console.error(e);
    document.getElementById('demoBar').textContent='Could not reach the API — check CONFIG.API_URL and the deployment.';}}

}

function renderNav(){

}
window.draw=draw;
document.getElementById('prev').onclick=()=>{const i=MONTHS.indexOf(current);if(i>0){current=MONTHS[i-1];draw();}};
